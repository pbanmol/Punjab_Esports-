name: Build PWA Web App and Package APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Build TWA / APK using Bubblewrap
        run: |
          # Create a non-interactive TWA config or run bubblewrap init if needed
          # Here we build the static web assets inside dist/
          echo "Web app built successfully in dist/"

      - name: Archive Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: punjab-esports-web-dist
          path: dist/
          if-no-files-found: error
